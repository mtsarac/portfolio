name: Deploy

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Dockhand redeploy
        env:
          URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
          SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')
          code=$(curl -sS --max-time 60 --retry 3 --retry-all-errors -o resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$body" "$URL")
          echo "HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && exit 0
          # Logs are public: show the body only on failure
          head -c 500 resp.txt
          exit 1
