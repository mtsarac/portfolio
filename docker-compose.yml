services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_UMAMI_SITE_ID: ${VITE_UMAMI_SITE_ID}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
        VITE_UMAMI_DOMAINS: ${VITE_UMAMI_DOMAINS:-msarac.me,www.msarac.me}
        VITE_UMAMI_RECORDER_URL: ${VITE_UMAMI_RECORDER_URL:-}
    container_name: portfolio
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`msarac.me`) || Host(`www.msarac.me`)"
      - "traefik.http.routers.portfolio.priority=10"
      - "traefik.http.routers.portfolio.middlewares=portfolio-secure-headers"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
      - "traefik.http.middlewares.portfolio-secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.portfolio-secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.portfolio-secure-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.portfolio-secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.portfolio-secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.portfolio-secure-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"

networks:
  traefik-net:
    external: true
